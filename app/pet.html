<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>pet</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
      #pet { position: absolute; left: 10px; bottom: 0; width: 100px; height: 100px; cursor: pointer; }
      #body { width: 100%; height: 100%; display: block; transition: transform .2s; }
      #pet.walking #body { animation: bob .4s ease-in-out infinite alternate; }
      #pet.left #body { transform: scaleX(-1); }
      #status { position: absolute; right: -6px; top: 4px; font-size: 22px; }
      #bubble { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); background: #fff; border-radius: 12px;
        padding: 2px 8px; font-size: 20px; box-shadow: 0 1px 4px #0003; opacity: 0; transition: opacity .2s; }
      #bubble.on { opacity: 1; }
      .jump #body { animation: jump .35s ease-out 3 !important; }
      .shake #body { animation: shake .1s linear 8 !important; }
      .squish #body { animation: squish .5s ease-in-out 3 !important; }
      @keyframes bob { to { translate: 0 -4px; } }
      @keyframes jump { 50% { translate: 0 -24px; } }
      @keyframes shake { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }
      @keyframes squish { 50% { scale: 1.15 .85; } }
    </style>
    <script type="module" src="/src/pet.ts"></script>
  </head>
  <body>
    <div id="pet">
      <img id="body" alt="" draggable="false" />
      <span id="status"></span>
      <span id="bubble"></span>
    </div>
  </body>
</html>
