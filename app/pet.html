<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>pet</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
      #pet { position: absolute; left: calc(50% - 50px); bottom: 0; width: 100px; height: 100px; cursor: pointer; touch-action: none; }
      #pet.dragging { cursor: grabbing; }
      #body { width: 100%; height: 100%; display: block; transition: transform .2s; }
      #pet.walking #body { animation: bob .4s ease-in-out infinite alternate; }
      #pet.left #body { transform: scaleX(-1); }
      #pet::before { content: ''; position: absolute; left: 22%; right: 22%; bottom: 3px; height: 8px; border-radius: 50%; background: #0002; }
      #status { position: absolute; right: -6px; top: 4px; font-size: 22px; }
      #badge { position: absolute; left: -8px; top: 4px; font: 600 11px system-ui, sans-serif; color: #2b2124; background: #fffd;
        border-radius: 8px; padding: 1px 5px; white-space: nowrap; box-shadow: 0 1px 3px #0003; }
      #badge:empty { display: none; }
      #bubble { position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); background: #fff; border-radius: 12px;
        padding: 2px 8px; font-size: 20px; box-shadow: 0 1px 4px #0003; opacity: 0; transition: opacity .2s; }
      #bubble.on { opacity: 1; }
      #bubble.say { bottom: calc(100% + 10px); width: max-content; max-width: 196px; padding: 6px 10px; box-sizing: border-box;
        font: 13px/1.4 system-ui, sans-serif; color: #222; word-break: keep-all; overflow-wrap: anywhere; }
      #bubble.say::after { content: ''; position: absolute; left: 50%; top: 100%; translate: -50% 0;
        border: 6px solid transparent; border-top-color: #fff; }
      #tag { position: absolute; left: 50%; bottom: 1px; translate: -50% 0; max-width: 110px; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; font: 600 11px system-ui, sans-serif; color: #2b2124; background: #fffd; border-radius: 8px; padding: 0 6px; }
      #tag:empty { display: none; }
      .jump #body { animation: jump .35s ease-out 3 !important; }
      .shake #body { animation: shake .1s linear 8 !important; }
      .squish #body { animation: squish .5s ease-in-out 3 !important; }
      .heart { position: absolute; font-size: 16px; translate: -50% -50%; pointer-events: none; animation: fly .9s ease-out both; }
      .heart.incoming { animation: incoming .45s ease-in both; }
      @keyframes fly { from { opacity: 0; } 15% { opacity: 1; } to { opacity: 0; transform: translate(var(--dx), -55px) scale(1.4); } }
      @keyframes incoming { from { opacity: 0; } 20% { opacity: 1; } to { transform: translateX(55px) scale(1.3); } }
      @keyframes bob { to { translate: 0 -4px; } }
      @keyframes jump { 50% { translate: 0 -24px; } }
      @keyframes shake { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }
      @keyframes squish { 50% { scale: 1.15 .85; } }
    </style>
    <script type="module" src="/src/pet.ts"></script>
  </head>
  <body>
    <div id="pet">
      <img id="body" alt="" draggable="false" />
      <span id="status"></span>
      <span id="badge"></span>
      <span id="bubble"></span>
      <span id="tag"></span>
    </div>
  </body>
</html>
