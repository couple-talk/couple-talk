    <path d="M45 70q5 5 10 0" fill="none" stroke="#2b2124" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <g transform="rotate(7 604 850) translate(374 400) scale(5)">
    <path d="M18 66c0-26 14-44 32-44s32 18 32 44c0 18-14 26-32 26S18 84 18 66z" fill="#b8dcff" stroke="#3f86d1" stroke-width="3"/>
    <path d="M33 60q5-6 10 0M57 60q5-6 10 0" fill="none" stroke="#2b2124" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="30" cy="70" rx="6" ry="3.5" fill="#ff9fb8" opacity=".8"/>
    <ellipse cx="70" cy="70" rx="6" ry="3.5" fill="#ff9fb8" opacity=".8"/>
